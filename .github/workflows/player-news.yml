name: Player News updater

# Collects official Magic, Disney Lorcana, Riftbound, Yu-Gi-Oh! and Pokémon announcements
# (ban lists, rules updates, events), writes original fact-only summaries and
# publishes them to realrunecards.com/news/. No secrets or API keys are used.
on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours (UTC)
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "tools/news-updater/**"
      - ".github/workflows/player-news.yml"

permissions:
  contents: write
  pages: write

concurrency:
  group: player-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Collect official announcements
        run: node tools/news-updater/update-news.mjs

      - name: Publish changes
        run: |
          if [ -z "$(git status --porcelain -- news sitemap.xml robots.txt)" ]; then
            echo "No news changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news sitemap.xml robots.txt
          git commit -m "Player News: automatic update from official sources"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "Push failed after 3 attempts" >&2
          exit 1
        id: publish

      # Pushes made with GITHUB_TOKEN do not start a Pages build on their own,
      # so request one explicitly and fail the job if it is refused or does not finish.
      - name: Rebuild GitHub Pages
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds"
          hdr=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          head_sha="$(git rev-parse HEAD)"
          curl -fsS -X POST "${hdr[@]}" "$api"
          for i in $(seq 1 40); do
            sleep 15
            latest="$(curl -fsS "${hdr[@]}" "$api/latest")"
            status="$(echo "$latest" | jq -r .status)"; commit="$(echo "$latest" | jq -r .commit)"
            echo "Pages build: status=$status commit=$commit"
            if [ "$commit" = "$head_sha" ] && [ "$status" = "built" ]; then exit 0; fi
            if [ "$commit" = "$head_sha" ] && [ "$status" = "errored" ]; then echo "$latest" >&2; exit 1; fi
          done
          echo "Pages build for $head_sha did not finish in time" >&2
          exit 1

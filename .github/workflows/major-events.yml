name: Upcoming Major Events updater

# Refreshes Upcoming Major Events on events.html from official Riftbound, Disney Lorcana
# and Magic schedule pages. No secrets or API keys are used.
on:
  schedule:
    - cron: "47 */6 * * *"   # every 6 hours (UTC), offset from Player News
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "tools/events-updater/**"
      - ".github/workflows/major-events.yml"

permissions:
  contents: write
  pages: write

concurrency:
  group: major-events
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Test date parsing and change handling
        run: node tools/events-updater/test-events.mjs

      - name: Collect official event schedules
        run: node tools/events-updater/collect-events.mjs

      - name: Publish changes
        id: publish
        run: |
          if [ -z "$(git status --porcelain -- events)" ]; then
            echo "No event changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events
          git commit -m "Upcoming Major Events: automatic update from official schedules"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "Push failed after 3 attempts" >&2
          exit 1

      # Pushes made with GITHUB_TOKEN do not start a Pages build on their own,
      # so request one explicitly and fail the job if it is refused or does not finish.
      - name: Rebuild GitHub Pages
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds"
          hdr=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          head_sha="$(git rev-parse HEAD)"
          curl -fsS -X POST "${hdr[@]}" "$api"
          for i in $(seq 1 40); do
            sleep 15
            latest="$(curl -fsS "${hdr[@]}" "$api/latest")"
            status="$(echo "$latest" | jq -r .status)"; commit="$(echo "$latest" | jq -r .commit)"
            echo "Pages build: status=$status commit=$commit"
            if [ "$commit" = "$head_sha" ] && [ "$status" = "built" ]; then exit 0; fi
            if [ "$commit" = "$head_sha" ] && [ "$status" = "errored" ]; then echo "$latest" >&2; exit 1; fi
          done
          echo "Pages build for $head_sha did not finish in time" >&2
          exit 1
